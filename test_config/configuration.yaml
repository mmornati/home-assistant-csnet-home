---

# Home Assistant Test Configuration for CSNet Home Integration
# This is a minimal configuration for testing the custom component

# Configure a default setup of Home Assistant (frontend, api, etc)
default_config:

# Debug logging for the integration: the CSNet responses end up in the
# container log. Credentials, location and account ids are redacted there, but
# names and hardware ids are not: do not post this log publicly.
logger:
  default: info
  logs:
    custom_components.csnet_home: debug

# Enable the recorder to store history (optional for testing)
recorder:
  db_url: sqlite:////config/.storage/home-assistant_v2.db
  purge_keep_days: 3

# Text to speech
tts:
  - platform: google_translate

# Example automation for testing
automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# The CSNet Home integration will be configured through the UI
# Go to: Configuration -> Integrations -> Add Integration -> Hitachi CSNet Home
