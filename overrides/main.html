{% extends "base.html" %}

{% block extrahead %}
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Martian+Mono:wght@400;500&display=swap">
  <meta property="og:title" content="{% if page.title and not page.is_homepage %}{{ page.title }} · {% endif %}{{ config.site_name }}">
  <meta property="og:description" content="{{ config.site_description }}">
  <meta property="og:type" content="website">
{% endblock %}
