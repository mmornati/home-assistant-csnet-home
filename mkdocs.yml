---
site_name: Hitachi CSNet Home Integration
site_description: >-
  Unofficial Home Assistant integration for Hitachi Yutaki and Yutampo heat pumps
  with the ATW-IOT-01 module (CSNet Manager). Zones, hot water, pool, compressor
  and energy sensors, alarms.
site_author: Marco Mornati
site_url: https://mmornati.github.io/home-assistant-csnet-home/

repo_name: mmornati/home-assistant-csnet-home
repo_url: https://github.com/mmornati/home-assistant-csnet-home
edit_uri: edit/main/docs/

copyright: >-
  Copyright &copy; 2024 Marco Mornati, Apache License 2.0.
  Independent project, not affiliated with or endorsed by Hitachi.
  Hitachi, Yutaki, Yutampo and CSNet Manager are trademarks of their respective owners.

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: images/mark.svg
  favicon: images/mark.svg
  font:
    text: Hanken Grotesk
    code: JetBrains Mono
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.action.view
    - announce.dismiss

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mmornati/home-assistant-csnet-home
    - icon: fontawesome/solid/bug
      link: https://github.com/mmornati/home-assistant-csnet-home/issues
    - icon: fontawesome/solid/comments
      link: https://github.com/mmornati/home-assistant-csnet-home/discussions
  analytics:
    provider: google
    property: !ENV GOOGLE_ANALYTICS_KEY

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - search:
      lang: en
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
      htmlmin_opts:
        remove_comments: true

nav:
  - Home: index.md
  - Documentation:
      - Overview: wiki/Home.md
      - Getting Started:
          - 01 Installation Guide: wiki/Installation-Guide.md
          - 02 Configuration Guide: wiki/Configuration-Guide.md
      - Features:
          - 03 Climate Control: wiki/Climate-Control.md
          - 04 Multi-Zone Configuration: wiki/Multi-Zone-Configuration.md
          - 05 Water Heater Control: wiki/Water-Heater-Control.md
          - 06 Sensors Reference: wiki/Sensors-Reference.md
          - 07 Compressor Sensors: COMPRESSOR_SENSORS.md
          - 08 Advanced Features: wiki/Advanced-Features.md
      - 09 How It Works & Disclaimer: wiki/How-It-Works.md
      - Help:
          - 10 Troubleshooting: wiki/Troubleshooting.md
          - 11 FAQ: wiki/FAQ.md
  - Supported Devices: SUPPORTED_DEVICES.md
