---

name: Validate

'on':
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Validate with Hassfest
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout
        uses: "actions/checkout@v7"

      - name: Run Hassfest
        uses: home-assistant/actions/hassfest@master

  hacs_validation:
    name: HACS Validation
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: HACS validation
        uses: hacs/action@main
        with:
          ignore: brands
          category: integration

  style:
    name: Check Code Style
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout
        uses: "actions/checkout@v7"

      - name: Setup Python
        uses: "actions/setup-python@v7"
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install formatter tools
        run: python3 -m pip install black==25.12.0 isort==5.13.2

      - name: Check formatting with Black
        run: black --check --diff .

      - name: Check imports with isort
        run: isort --check-only --diff .

  lint:
    name: Lint with Pylint
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout
        uses: "actions/checkout@v7"

      - name: Setup Python
        uses: "actions/setup-python@v7"
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r custom_components/csnet_home/requirements-dev.txt

      - name: Run Pylint
        run: pylint custom_components/csnet_home
        continue-on-error: true

  tests:
    name: Unit Tests (latest HA)
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout
        uses: "actions/checkout@v7"

      - name: Resolve latest Home Assistant
        id: ha
        run: python3 scripts/ci/ha_versions.py --months 1

      - name: Setup Python
        uses: "actions/setup-python@v7"
        with:
          python-version: ${{ steps.ha.outputs.latest_python }}
          cache: 'pip'

      # Pinning HA and letting pip pick the matching test harness avoids the
      # dependency conflicts that made pytest unreliable here before.
      - name: Install Home Assistant ${{ steps.ha.outputs.latest }}
        id: install
        run: scripts/ci/install_ha.sh "${{ steps.ha.outputs.latest }}" tests

      - name: Run pytest
        if: steps.install.outputs.harness == 'ready'
        run: pytest tests/ -q --cov=custom_components/csnet_home --cov-report=term-missing

  security:
    name: Security Scan
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout
        uses: "actions/checkout@v7"

      - name: Setup Python
        uses: "actions/setup-python@v7"
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r custom_components/csnet_home/requirements-dev.txt
          python3 -m pip install bandit safety

      - name: Run Bandit security scan
        run: bandit -r custom_components/csnet_home -c tests/bandit.yaml
        continue-on-error: true

      - name: Check dependencies for vulnerabilities
        run: safety check --json || true
        continue-on-error: true
