---
# Detects each new Home Assistant release (beta and stable) and asks Claude to
# review it against this integration: release notes, developer-blog breaking
# changes, and a diff of the HA base classes we inherit from. The result is
# posted as one issue per monthly release.
#
# Security: Claude reads third-party text (release notes, blog posts), so it is
# called once through the Messages API with no tools (scripts/ci/ha_review.py),
# from a job with read-only permissions. A separate job with no LLM involved
# opens the issue. Fixes are left to a human rather than pushed automatically.
#
# GitHub has no webhook for releases of another repository, so this polls PyPI.
# Each monthly release (YYYY.M) is reviewed once, at its first beta when there
# is one, otherwise at the stable release; the issue title is the dedupe key.
# Patch releases are covered by the deterministic nightly workflow.
#
# Requires the ANTHROPIC_API_KEY repository secret (API credit, about $0.50 a run).
name: HA Release Review (Claude)

'on':
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'HA version to review (e.g. 2026.11.0 or 2026.11.0b1). Empty = auto-detect.'
        type: string
        default: ''
      model:
        description: 'Claude model for this run (e.g. claude-sonnet-5-5). Empty = HA_REVIEW_MODEL.'
        type: string
        default: ''

permissions:
  contents: read

# Model used for the review: the manual-run input, else the HA_REVIEW_MODEL
# repository variable (Settings > Secrets and variables > Actions > Variables),
# else the default below.
env:
  HA_REVIEW_MODEL: ${{ inputs.model || vars.HA_REVIEW_MODEL || 'claude-opus-5-5' }}

concurrency:
  group: ha-release-review
  cancel-in-progress: false

jobs:
  detect:
    name: Detect unreviewed HA release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    outputs:
      version: ${{ steps.pick.outputs.version }}
      release: ${{ steps.pick.outputs.release }}
      previous: ${{ steps.pick.outputs.previous }}
      python: ${{ steps.pick.outputs.python }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve versions from PyPI
        id: ha
        run: python3 scripts/ci/ha_versions.py --months 2

      - name: Pick version to review
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.version }}
          LATEST: ${{ steps.ha.outputs.latest }}
          LATEST_PY: ${{ steps.ha.outputs.latest_python }}
          BETA: ${{ steps.ha.outputs.beta }}
          BETA_PY: ${{ steps.ha.outputs.beta_python }}
          MATRIX: ${{ steps.ha.outputs.matrix }}
        run: |
          gh label create ha-release-review --color 41BDF5 \
            --description "Automated review of a new Home Assistant release" 2>/dev/null || true

          # 2026.11.0b1 -> 2026.11
          release_of() { echo "$1" | cut -d. -f1,2; }
          reviewed() {
            gh issue list --label ha-release-review --state all --limit 1 \
              --search "in:title \"Home Assistant $(release_of "$1") compatibility review\"" \
              --json number --jq 'length' | grep -q '^1$'
          }

          PREV_STABLE=$(echo "$MATRIX" | jq -r '.[-2].ha // empty')
          VERSION=""
          if [ -n "$REQUESTED" ]; then
            if ! [[ "$REQUESTED" =~ ^20[0-9]{2}\.[0-9]+\.[0-9]+(b[0-9]+)?$ ]]; then
              echo "::error::Invalid version '$REQUESTED'"; exit 1
            fi
            VERSION="$REQUESTED"; PREVIOUS="$LATEST"; PY="$LATEST_PY"
            [ "$VERSION" = "$LATEST" ] && PREVIOUS="$PREV_STABLE"
          elif [ -n "$BETA" ] && ! reviewed "$BETA"; then
            VERSION="$BETA"; PREVIOUS="$LATEST"; PY="$BETA_PY"
          elif ! reviewed "$LATEST"; then
            VERSION="$LATEST"; PREVIOUS="$PREV_STABLE"; PY="$LATEST_PY"
          fi

          if [ -z "$VERSION" ]; then
            echo "Nothing new to review (latest=$LATEST beta=${BETA:-none})"
          else
            echo "Reviewing HA $VERSION (previous: ${PREVIOUS:-none})"
          fi
          {
            echo "version=$VERSION"
            echo "release=$(release_of "$VERSION")"
            echo "previous=${PREVIOUS:-}"
            echo "python=${PY:-3.14}"
          } >> "$GITHUB_OUTPUT"

  review:
    name: Claude review - HA ${{ needs.detect.outputs.version }}
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.version != ''
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ needs.detect.outputs.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ needs.detect.outputs.python }}

      # Deterministic checks first, so Claude starts from facts and needs no shell.
      - name: Install Home Assistant ${{ needs.detect.outputs.version }}
        id: install
        run: scripts/ci/install_ha.sh "${{ needs.detect.outputs.version }}" tests

      - name: Import smoke test
        continue-on-error: true
        run: |
          mkdir -p ha-review-input
          python scripts/ci/import_smoke.py 2>&1 | tee ha-review-input/import_smoke.log

      - name: Unit tests
        if: steps.install.outputs.harness == 'ready'
        continue-on-error: true
        run: pytest tests/ -q --tb=short 2>&1 | tee ha-review-input/pytest.log

      - name: Release notes
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: gh release view "$VERSION" -R home-assistant/core --json body --jq .body > ha-review-input/release-notes.md

      - name: Diff the HA modules this integration builds on
        if: needs.detect.outputs.previous != ''
        env:
          OLD: ${{ needs.detect.outputs.previous }}
          NEW: ${{ needs.detect.outputs.version }}
        run: |
          for v in "$OLD" "$NEW"; do
            python -m pip download --no-deps --quiet -d "/tmp/ha-$v" "homeassistant==$v"
            (cd "/tmp/ha-$v" && python -m zipfile -e ./*.whl src)
          done
          FILES="components/climate/__init__.py components/climate/const.py
                 components/water_heater/__init__.py components/sensor/__init__.py
                 components/number/__init__.py helpers/entity.py helpers/entity_platform.py
                 helpers/update_coordinator.py helpers/device_registry.py config_entries.py
                 data_entry_flow.py const.py"
          : > ha-review-input/ha-api.diff
          for f in $FILES; do
            diff -u "/tmp/ha-$OLD/src/homeassistant/$f" "/tmp/ha-$NEW/src/homeassistant/$f" \
              --label "$OLD/$f" --label "$NEW/$f" >> ha-review-input/ha-api.diff || true
          done
          wc -l ha-review-input/ha-api.diff

      # One Messages API call with no tools (scripts/ci/ha_review.py): the
      # third-party text it reads can only shape the report, not trigger actions.
      # Separate venv so the SDK cannot disturb the Home Assistant install above.
      - name: Claude compatibility review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VERSION: ${{ needs.detect.outputs.version }}
          PREVIOUS: ${{ needs.detect.outputs.previous }}
        run: |
          if ! [[ "$HA_REVIEW_MODEL" =~ ^claude-[a-z0-9.-]+$ ]]; then
            echo "::error::Invalid model id '$HA_REVIEW_MODEL'"; exit 1
          fi
          python -m venv /tmp/review-venv
          /tmp/review-venv/bin/pip install --quiet "anthropic>=2.3,<3"
          /tmp/review-venv/bin/python scripts/ci/ha_review.py \
            --version "$VERSION" --previous "${PREVIOUS:-$VERSION}" \
            --inputs ha-review-input --output ha-review.md

      # Check before the artifact upload too: artifacts are readable by anyone
      # with read access to the repository. Fails closed if there is no report.
      - name: Check report for credentials
        run: |
          if [ ! -s ha-review.md ]; then
            echo "::error::No review report was produced."
            exit 1
          fi
          SECRET_RE='sk-ant-|gh[opsur]_[A-Za-z0-9]{20,}|github_pat_|AKIA[0-9A-Z]{16}'
          SECRET_RE="${SECRET_RE}|-----BEGIN|[A-Za-z0-9+/=]{80,}"
          if grep -Eq "$SECRET_RE" ha-review.md; then
            echo "::error::Report contains credential-like content; discarded."
            rm -f ha-review.md
            exit 1
          fi

      - name: Upload report
        uses: actions/upload-artifact@v7
        with:
          retention-days: 7
          name: ha-review
          path: ha-review.md
          if-no-files-found: error

  publish:
    name: Open review issue
    runs-on: ubuntu-latest
    needs: [detect, review]
    permissions:
      issues: write
    steps:
      - name: Download report
        uses: actions/download-artifact@v8
        with:
          name: ha-review

      - name: Create issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE: ${{ needs.detect.outputs.release }}
          VERSION: ${{ needs.detect.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # The report was written by an LLM that read third-party text: refuse
          # anything that looks like a credential, and neutralise @mentions.
          if [ ! -s ha-review.md ]; then
            echo "::error::Review report is missing or empty."
            exit 1
          fi
          SECRET_RE='sk-ant-|gh[opsur]_[A-Za-z0-9]{20,}|github_pat_|AKIA[0-9A-Z]{16}'
          SECRET_RE="${SECRET_RE}|-----BEGIN|[A-Za-z0-9+/=]{80,}"
          if grep -Eq "$SECRET_RE" ha-review.md; then
            echo "::error::Report contains credential-like content; not publishing."
            exit 1
          fi
          if [ "$(wc -c < ha-review.md)" -gt 60000 ]; then
            echo "::error::Report is larger than 60 KB; not publishing."
            exit 1
          fi
          sed -i 's/@\([A-Za-z0-9]\)/@\xE2\x80\x8B\1/g' ha-review.md
          {
            cat ha-review.md
            echo ""
            echo "---"
            echo "_Automated review of HA ${VERSION} by Claude (${HA_REVIEW_MODEL}) · [workflow run](${RUN_URL})._"
            echo "_Generated from third-party release notes: verify before acting._"
          } > body.md
          gh issue create --label ha-release-review \
            --title "Home Assistant ${RELEASE} compatibility review" --body-file body.md
