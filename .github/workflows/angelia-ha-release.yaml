---
# Runs when Angelia (https://angelia-dev.github.io/docs/) sees a new Home Assistant
# release on github.com/home-assistant/core and sends a repository_dispatch.
#
#   1. test    installs that exact HA version and runs the import smoke test and
#              the unit tests against it (deterministic, no LLM, free).
#   2. review  if this monthly release has no compatibility review yet, starts
#              "HA Release Review (Claude)" for it. That workflow opens an issue;
#              labelling the issue `ha-review:fix` lets Claude open a fix PR.
#
# Security: the payload comes from a public registry through Angelia. Every value
# goes through env: and is validated against the HA version pattern before use.
name: HA Release from Angelia

'on':
  repository_dispatch:
    types: [ha-release]

permissions:
  contents: read

# A retried delivery carries the same event id: never run twice for one event.
concurrency:
  group: angelia-${{ github.event.client_payload.event_id }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate the release event
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
      python: ${{ steps.check.outputs.python }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check payload
        id: check
        env:
          PACKAGE: ${{ github.event.client_payload.package }}
          VERSION: ${{ github.event.client_payload.version }}
          PREVIOUS: ${{ github.event.client_payload.previous_version }}
          BUMP: ${{ github.event.client_payload.bump }}
          EVENT_ID: ${{ github.event.client_payload.event_id }}
          RELEASE_URL: ${{ github.event.client_payload.release_url }}
        run: |
          if [ "$PACKAGE" != "home-assistant/core" ]; then
            echo "::error::Unexpected package '$PACKAGE'"; exit 1
          fi
          if ! [[ "$VERSION" =~ ^20[0-9]{2}\.[0-9]+\.[0-9]+(b[0-9]+)?$ ]]; then
            echo "::error::Invalid version '$VERSION'"; exit 1
          fi
          PY=$(python3 scripts/ci/ha_versions.py --months 2 | python3 -c \
            'import json,sys; d=json.load(sys.stdin); print(d["beta_python"] if d.get("beta") else d["latest_python"])')
          {
            echo "version=$VERSION"
            echo "release=$(echo "$VERSION" | cut -d. -f1,2)"
            echo "python=${PY:-3.14}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Home Assistant $VERSION, reported by Angelia"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Previous version | ${PREVIOUS:-none} |"
            echo "| Bump | ${BUMP:-n/a} |"
            echo "| Release | ${RELEASE_URL:-n/a} |"
            echo "| Angelia event | \`$EVENT_ID\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Tests against HA ${{ needs.validate.outputs.version }}
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ needs.validate.outputs.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ needs.validate.outputs.python }}

      - name: Wait for the release on PyPI
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "https://pypi.org/pypi/homeassistant/$VERSION/json" > /dev/null; then exit 0; fi
            echo "homeassistant $VERSION not on PyPI yet, waiting ($i/20)"; sleep 60
          done
          echo "::error::homeassistant $VERSION is not on PyPI after 20 minutes"; exit 1

      - name: Install Home Assistant ${{ needs.validate.outputs.version }}
        id: install
        run: scripts/ci/install_ha.sh "${{ needs.validate.outputs.version }}" tests

      - name: Import smoke test
        run: python scripts/ci/import_smoke.py

      - name: Unit tests
        if: steps.install.outputs.harness == 'ready'
        run: pytest tests/ -q --tb=short

  review:
    name: Start the Claude review if this release has none
    runs-on: ubuntu-latest
    needs: [validate, test]
    if: always() && needs.validate.result == 'success'
    permissions:
      actions: write
      issues: read
    steps:
      - name: Start HA Release Review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.validate.outputs.version }}
          RELEASE: ${{ needs.validate.outputs.release }}
        run: |
          FOUND=$(gh issue list --label ha-release-review --state all --limit 1 \
            --search "in:title \"Home Assistant ${RELEASE} compatibility review\"" --json number --jq 'length')
          if [ "$FOUND" = "1" ]; then
            echo "Home Assistant $RELEASE already has a review: nothing to start." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh workflow run ha-release-review.yaml -f version="$VERSION"
          echo "Started HA Release Review (Claude) for $VERSION." | tee -a "$GITHUB_STEP_SUMMARY"
