---
name: Smoke Test - HA Compatibility

'on':
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  versions:
    name: Resolve HA Versions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Resolve versions from PyPI
        id: resolve
        run: python3 scripts/ci/ha_versions.py --months 3

  smoke-test:
    name: Smoke Test - HA ${{ matrix.ha }}
    runs-on: ubuntu-latest
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.versions.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: 'pip'

      - name: Install Home Assistant ${{ matrix.ha }}
        run: scripts/ci/install_ha.sh "${{ matrix.ha }}" runtime

      - name: Verify manifest
        run: |
          python - <<'EOF'
          import json, sys
          manifest = json.load(open("custom_components/csnet_home/manifest.json"))
          required = ("domain", "name", "version", "requirements", "config_flow", "iot_class")
          missing = [f for f in required if f not in manifest]
          if missing:
              sys.exit(f"manifest.json missing: {missing}")
          print("manifest.json OK")
          EOF

      - name: Import smoke test
        run: python scripts/ci/import_smoke.py
