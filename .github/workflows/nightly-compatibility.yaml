---
name: Nightly Compatibility Check

'on':
  schedule:
    # Run every night at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      send_notification:
        description: 'Create issue on failure'
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

jobs:
  versions:
    name: Resolve HA Versions
    runs-on: ubuntu-latest
    outputs:
      latest: ${{ steps.resolve.outputs.latest }}
      latest_python: ${{ steps.resolve.outputs.latest_python }}
      matrix: ${{ steps.resolve.outputs.matrix }}
      beta: ${{ steps.resolve.outputs.beta }}
      beta_python: ${{ steps.resolve.outputs.beta_python }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Resolve versions from PyPI
        id: resolve
        run: python3 scripts/ci/ha_versions.py --months 4

  # Full unit test suite against the newest stable release. No
  # continue-on-error: a failure here must turn the run (and the issue) red.
  test-latest-stable:
    name: Unit Tests - HA ${{ needs.versions.outputs.latest }}
    runs-on: ubuntu-latest
    needs: versions
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ needs.versions.outputs.latest_python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ needs.versions.outputs.latest_python }}

      - name: Install Home Assistant ${{ needs.versions.outputs.latest }}
        id: install
        run: scripts/ci/install_ha.sh "${{ needs.versions.outputs.latest }}" tests

      - name: Import smoke test
        run: python scripts/ci/import_smoke.py

      - name: Run unit tests
        if: steps.install.outputs.harness == 'ready'
        run: pytest tests/ --tb=short -q

  # Import every module on each recent monthly release.
  smoke-recent:
    name: Import Smoke - HA ${{ matrix.ha }}
    runs-on: ubuntu-latest
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.versions.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install Home Assistant ${{ matrix.ha }}
        run: scripts/ci/install_ha.sh "${{ matrix.ha }}" runtime

      - name: Import smoke test
        run: python scripts/ci/import_smoke.py

  # Early warning: the next release's beta (usually ~1 week before release).
  # The unit-test harness is not published for betas, so this is import-only.
  smoke-beta:
    name: Import Smoke - HA ${{ needs.versions.outputs.beta }} (beta)
    runs-on: ubuntu-latest
    needs: versions
    if: needs.versions.outputs.beta != ''
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ needs.versions.outputs.beta_python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ needs.versions.outputs.beta_python }}

      - name: Install Home Assistant ${{ needs.versions.outputs.beta }}
        run: scripts/ci/install_ha.sh "${{ needs.versions.outputs.beta }}" runtime

      - name: Import smoke test
        run: python scripts/ci/import_smoke.py 2>&1 | tee smoke-beta.log

      - name: Surface new HA deprecation warnings
        if: always()
        run: |
          if grep -i "deprecated" smoke-beta.log > deprecations.txt; then
            while read -r line; do echo "::warning::${line}"; done < deprecations.txt
          fi

  report:
    name: Compatibility Report
    runs-on: ubuntu-latest
    needs: [versions, test-latest-stable, smoke-recent, smoke-beta]
    if: always()
    steps:
      - name: Build report
        env:
          LATEST: ${{ needs.versions.outputs.latest }}
          BETA: ${{ needs.versions.outputs.beta }}
          MATRIX: ${{ needs.versions.outputs.matrix }}
          R_VERSIONS: ${{ needs.versions.result }}
          R_LATEST: ${{ needs.test-latest-stable.result }}
          R_RECENT: ${{ needs.smoke-recent.result }}
          R_BETA: ${{ needs.smoke-beta.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          icon() { case "$1" in success) echo "✅";; skipped) echo "⏭️";; *) echo "❌";; esac; }
          RECENT=$(echo "${MATRIX:-[]}" | jq -r 'map(.ha) | join(", ")')
          {
            echo "# Nightly Compatibility Report"
            echo ""
            echo "**Date**: $(date -u '+%Y-%m-%d %H:%M UTC') · [workflow run](${RUN_URL})"
            echo ""
            echo "| Check | Version(s) | Result |"
            echo "|---|---|---|"
            echo "| Resolve versions | PyPI | $(icon "$R_VERSIONS") ${R_VERSIONS} |"
            echo "| Unit tests (latest stable) | ${LATEST} | $(icon "$R_LATEST") ${R_LATEST} |"
            echo "| Import smoke (recent) | ${RECENT} | $(icon "$R_RECENT") ${R_RECENT} |"
            echo "| Import smoke (beta) | ${BETA:-none} | $(icon "$R_BETA") ${R_BETA} |"
          } > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"

          for r in "$R_VERSIONS" "$R_LATEST" "$R_RECENT" "$R_BETA"; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "status=failure" >> "$GITHUB_ENV"
            fi
          done

      - name: Open or update compatibility issue
        if: >-
          env.status == 'failure' &&
          (github.event_name == 'schedule' ||
           (github.event_name == 'workflow_dispatch' && inputs.send_notification))
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('report.md', 'utf8');
            const { owner, repo } = context.repo;
            const issues = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'compatibility,automated'
            });
            const existing = issues.data.find(i => i.title.includes('Compatibility Check Failed'));
            if (existing) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number, body: report
              });
            } else {
              await github.rest.issues.create({
                owner, repo,
                title: '🚨 Nightly Compatibility Check Failed',
                body: report,
                labels: ['compatibility', 'automated', 'needs-investigation']
              });
            }

      - name: Comment when passing again
        if: env.status != 'failure' && github.event_name == 'schedule'
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const issues = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'compatibility,automated'
            });
            const existing = issues.data.find(i => i.title.includes('Compatibility Check Failed'));
            if (existing) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: '✅ Nightly compatibility check is passing again. Close this issue if it stays green.'
              });
            }

      - name: Fail the run
        if: env.status == 'failure'
        run: exit 1
