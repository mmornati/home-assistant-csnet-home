---
# Opens a pull request for the findings of an HA release review issue, once a
# maintainer approves it by adding the `ha-review:fix` label.
#
# The label is the decision: only someone with write access can trigger this,
# and the result is always a PR for human review, never a merge.
#
# Security: the review issue was generated from third-party text, so the job
# that runs Claude (scripts/ci/ha_fix.py) has `contents: read` only and tools
# confined to custom_components/csnet_home and tests, plus pytest. It produces
# a patch; a separate job without an LLM checks the touched paths and opens the
# PR.
#
# Requires the ANTHROPIC_API_KEY repository secret. The model follows the
# HA_REVIEW_MODEL repository variable, like the review workflow.
name: HA Review Fix (Claude)

'on':
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: 'Number of the HA release review issue to fix'
        required: true
        type: string
      model:
        description: 'Claude model for this run (e.g. claude-sonnet-5-5). Empty = HA_REVIEW_MODEL.'
        type: string
        default: ''

permissions:
  contents: read

env:
  HA_REVIEW_MODEL: ${{ inputs.model || vars.HA_REVIEW_MODEL || 'claude-opus-5-5' }}

concurrency:
  group: ha-review-fix-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

jobs:
  gate:
    name: Check approval
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'ha-review:fix' &&
       contains(github.event.issue.labels.*.name, 'ha-release-review'))
    permissions:
      issues: read
    outputs:
      issue: ${{ steps.check.outputs.issue }}
    steps:
      - name: Check issue and who approved it
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
          SENDER: ${{ github.event.sender.login || github.actor }}
        run: |
          if ! [[ "$ISSUE" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid issue number '$ISSUE'"; exit 1
          fi
          if ! gh issue view "$ISSUE" --json labels --jq '.labels[].name' | grep -qx ha-release-review; then
            echo "::error::#$ISSUE is not an HA release review issue"; exit 1
          fi
          PERMISSION=$(gh api "repos/$GH_REPO/collaborators/$SENDER/permission" --jq .permission)
          case "$PERMISSION" in
            admin|maintain|write) echo "Approved by $SENDER ($PERMISSION)" ;;
            *) echo "::error::$SENDER has '$PERMISSION' access; write access is required"; exit 1 ;;
          esac
          echo "issue=$ISSUE" >> "$GITHUB_OUTPUT"

  fix:
    name: Claude fix - issue ${{ needs.gate.outputs.issue }}
    runs-on: ubuntu-latest
    needs: gate
    timeout-minutes: 60
    permissions:
      contents: read
      issues: read
    outputs:
      result: ${{ steps.result.outputs.result }}
      has_patch: ${{ steps.patch.outputs.has_patch }}
      tests: ${{ steps.verify.outputs.tests }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve latest Home Assistant
        id: ha
        run: python3 scripts/ci/ha_versions.py --months 1

      - name: Set up Python ${{ steps.ha.outputs.latest_python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ steps.ha.outputs.latest_python }}

      - name: Install Home Assistant ${{ steps.ha.outputs.latest }}
        run: scripts/ci/install_ha.sh "${{ steps.ha.outputs.latest }}" tests

      - name: Fetch the review issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ needs.gate.outputs.issue }}
        run: gh issue view "$ISSUE" --json number,title,body > "$RUNNER_TEMP/issue.json"

      # Separate venv for the SDK; pytest runs in the Home Assistant env above.
      - name: Claude fix
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if ! [[ "$HA_REVIEW_MODEL" =~ ^claude-[a-z0-9.-]+$ ]]; then
            echo "::error::Invalid model id '$HA_REVIEW_MODEL'"; exit 1
          fi
          HA_SRC=$(python -c 'import homeassistant, os; print(os.path.dirname(homeassistant.__file__))')
          PYTEST_PYTHON=$(command -v python)
          python -m venv "$RUNNER_TEMP/fix-venv"
          "$RUNNER_TEMP/fix-venv/bin/pip" install --quiet "anthropic>=2.3,<3" black==25.12.0 isort==5.13.2
          "$RUNNER_TEMP/fix-venv/bin/python" scripts/ci/ha_fix.py \
            --issue "$RUNNER_TEMP/issue.json" --ha-src "$HA_SRC" --pytest-python "$PYTEST_PYTHON" \
            --summary-out "$RUNNER_TEMP/ha-fix-summary.md"

      - name: Read result
        id: result
        run: |
          RESULT=$(head -1 "$RUNNER_TEMP/ha-fix-summary.md" | sed 's/^Result: //')
          echo "result=$RESULT" >> "$GITHUB_OUTPUT"

      - name: Format changed code
        run: |
          "$RUNNER_TEMP/fix-venv/bin/black" --quiet custom_components/csnet_home tests
          "$RUNNER_TEMP/fix-venv/bin/isort" --quiet custom_components/csnet_home tests

      # Re-run the tests here rather than trusting Claude's own run.
      - name: Verify tests
        id: verify
        run: |
          if pytest tests/ -q --tb=short -p no:cacheprovider > "$RUNNER_TEMP/pytest.log" 2>&1; then
            echo "tests=passed" >> "$GITHUB_OUTPUT"
          else
            echo "tests=failed" >> "$GITHUB_OUTPUT"
            echo "::warning::Tests fail with Claude's changes; the PR will say so"
          fi
          tail -3 "$RUNNER_TEMP/pytest.log"

      - name: Build patch
        id: patch
        run: |
          git add -A
          ALLOWED='^(custom_components/csnet_home/|tests/)'
          OUTSIDE=$(git diff --cached --name-only | grep -Ev "$ALLOWED" || true)
          MANIFEST=custom_components/csnet_home/manifest.json
          if [ -n "$OUTSIDE" ] || git diff --cached --name-only | grep -qx "$MANIFEST"; then
            echo "::error::Changes outside the allowed paths: ${OUTSIDE:-manifest.json}"; exit 1
          fi
          git diff --cached --binary > "$RUNNER_TEMP/ha-fix.patch"
          if [ -s "$RUNNER_TEMP/ha-fix.patch" ]; then
            echo "has_patch=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat
          else
            echo "has_patch=false" >> "$GITHUB_OUTPUT"
            echo "No changes."
          fi
          tail -1 "$RUNNER_TEMP/pytest.log" > "$RUNNER_TEMP/pytest-summary.txt"
          cp "$RUNNER_TEMP/ha-fix.patch" "$RUNNER_TEMP/ha-fix-summary.md" "$RUNNER_TEMP/pytest-summary.txt" .

      - name: Upload fix
        uses: actions/upload-artifact@v7
        with:
          name: ha-fix
          retention-days: 7
          path: |
            ha-fix.patch
            ha-fix-summary.md
            pytest-summary.txt

  pr:
    name: Open pull request
    runs-on: ubuntu-latest
    needs: [gate, fix]
    if: needs.fix.outputs.has_patch == 'true'
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download fix
        uses: actions/download-artifact@v8
        with:
          name: ha-fix
          path: ${{ runner.temp }}/ha-fix

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ needs.gate.outputs.issue }}
          RESULT: ${{ needs.fix.outputs.result }}
          TESTS: ${{ needs.fix.outputs.tests }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FIX_DIR: ${{ runner.temp }}/ha-fix
        run: |
          git apply --index "$FIX_DIR/ha-fix.patch"
          # Same path check as the fix job, in case the artifact was altered.
          if git diff --cached --name-only | grep -Ev '^(custom_components/csnet_home/|tests/)' \
              || git diff --cached --name-only | grep -qx custom_components/csnet_home/manifest.json; then
            echo "::error::Patch touches files outside the allowed paths"; exit 1
          fi

          scripts/ci/sanitize_report.sh "$FIX_DIR/ha-fix-summary.md"
          BRANCH="claude/ha-fix-${ISSUE}-${GITHUB_RUN_ID}"
          git switch -c "$BRANCH"
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "fix: address HA release review #${ISSUE}" \
              -m "Generated by Claude (${HA_REVIEW_MODEL}) from the findings in #${ISSUE}."
          git push -q origin "$BRANCH"

          {
            cat "$FIX_DIR/ha-fix-summary.md"
            echo ""
            echo "## Checks"
            echo "- Tests re-run by the workflow after formatting: **${TESTS}** ($(cat "$FIX_DIR/pytest-summary.txt"))"
            echo "- Opened by the workflow token, so CI does not start on its own: close and reopen the PR to run it."
            echo ""
            echo "---"
            echo "_Generated by Claude (${HA_REVIEW_MODEL}) for #${ISSUE} · [workflow run](${RUN_URL})._"
            echo "_Review every change: the findings came from an automated review of third-party text._"
          } > body.md
          PR_URL=$(gh pr create --base main --head "$BRANCH" \
            --title "fix: address HA release review #${ISSUE} (${RESULT})" --body-file body.md)
          gh issue comment "$ISSUE" --body "Claude opened ${PR_URL} (result: ${RESULT}, tests: ${TESTS})."
          gh issue edit "$ISSUE" --remove-label ha-review:fix || true

  report:
    name: Report without changes
    runs-on: ubuntu-latest
    needs: [gate, fix]
    if: always() && needs.gate.result == 'success' && needs.fix.outputs.has_patch != 'true'
    permissions:
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci

      - name: Download fix
        if: needs.fix.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: ha-fix
          path: ${{ runner.temp }}/ha-fix

      - name: Comment on the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ needs.gate.outputs.issue }}
          FIX_RESULT: ${{ needs.fix.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SUMMARY: ${{ runner.temp }}/ha-fix/ha-fix-summary.md
        run: |
          if [ "$FIX_RESULT" = "success" ]; then
            scripts/ci/sanitize_report.sh "$SUMMARY"
            {
              echo "Claude found nothing to change for this review."
              echo ""
              cat "$SUMMARY"
              echo ""
              echo "_[workflow run](${RUN_URL})_"
            } > body.md
          else
            echo "The fix workflow failed before producing a result: see the [workflow run](${RUN_URL})." > body.md
          fi
          gh issue comment "$ISSUE" --body-file body.md
          gh issue edit "$ISSUE" --remove-label ha-review:fix 2>/dev/null || true
